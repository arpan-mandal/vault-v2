<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
<meta name="theme-color" content="#12141c">
<title>Cloud Storage</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2312141c'/%3E%3Cpath d='M6 9.5 12 6l6 3.5v5L12 18l-6-3.5z' fill='none' stroke='%23d9a441' stroke-width='1.6'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<script>
  (function () {
    var t = localStorage.getItem('vault-theme');
    if (t === 'light') document.documentElement.setAttribute('data-theme', 'light');
  })();
</script>
</head>
<body>
  <div id="login-container" class="screen">
    <div class="login-box">
      <div class="login-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="30" height="30"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 8.5 12 13l8-4.5M12 13v7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
      </div>
      <h1 data-vlt="login"></h1>
      <p class="login-sub">Sign in to reach your files.</p>
      <form id="login-form">
        <label class="field">
          <span>Username</span>
          <input type="text" id="username" autocomplete="username" required>
        </label>
        <label class="field">
          <span>Password</span>
          <input type="password" id="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn-primary btn-block">Sign in</button>
      </form>
      <div id="login-error" class="error hidden" role="alert"></div>
    </div>
  </div>
  <div id="app-container" class="screen hidden">
    <div class="shell">
      <header class="topbar">
        <div class="brand">
          <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M4 8.5 12 4l8 4.5v7L12 20l-8-4.5z" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M4 8.5 12 13l8-4.5M12 13v7" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
          <span data-vlt="wordmark"></span>
        </div>
        <div class="topbar-actions">
          <button id="theme-toggle" class="icon-btn" title="Toggle theme" aria-label="Toggle theme">
            <svg id="theme-icon-dark" viewBox="0 0 24 24" width="17" height="17"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
            <svg id="theme-icon-light" viewBox="0 0 24 24" width="17" height="17" class="hidden"><circle cx="12" cy="12" r="4.2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 2.5v2.4M12 19.1v2.4M4.9 4.9l1.7 1.7M17.4 17.4l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.9 19.1l1.7-1.7M17.4 6.6l1.7-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button id="settings-btn" class="icon-btn hidden" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="17" height="17"><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M19.4 13.5a1.8 1.8 0 0 0 .36 1.98l.06.07a2.2 2.2 0 1 1-3.1 3.1l-.07-.06a1.8 1.8 0 0 0-1.98-.36 1.8 1.8 0 0 0-1.1 1.65v.2a2.2 2.2 0 1 1-4.4 0v-.1a1.8 1.8 0 0 0-1.17-1.65 1.8 1.8 0 0 0-1.98.36l-.07.06a2.2 2.2 0 1 1-3.1-3.1l.06-.07a1.8 1.8 0 0 0 .36-1.98 1.8 1.8 0 0 0-1.65-1.1h-.2a2.2 2.2 0 1 1 0-4.4h.1a1.8 1.8 0 0 0 1.65-1.17 1.8 1.8 0 0 0-.36-1.98l-.06-.07a2.2 2.2 0 1 1 3.1-3.1l.07.06a1.8 1.8 0 0 0 1.98.36h.09a1.8 1.8 0 0 0 1.1-1.65v-.2a2.2 2.2 0 1 1 4.4 0v.1a1.8 1.8 0 0 0 1.1 1.65h.09a1.8 1.8 0 0 0 1.98-.36l.07-.06a2.2 2.2 0 1 1 3.1 3.1l-.06.07a1.8 1.8 0 0 0-.36 1.98v.09a1.8 1.8 0 0 0 1.65 1.1h.2a2.2 2.2 0 1 1 0 4.4h-.1a1.8 1.8 0 0 0-1.65 1.1z" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          </button>
          <button id="logout-btn" class="btn-ghost">Sign out</button>
        </div>
      </header>
      <section class="gauge-panel" aria-label="Storage usage">
        <div class="gauge-readout">
          <div class="gauge-figure" id="gauge-figure">Calculating usage&hellip;</div>
          <div class="gauge-label hidden" id="gauge-label"></div>
        </div>
        <div class="gauge-track hidden" id="gauge-track" role="img" aria-label="Storage capacity">
          <div id="gauge-segments" class="gauge-segments"></div>
        </div>
      </section>
      <div class="toolbar">
        <div class="breadcrumb" id="breadcrumb" aria-label="Current folder"></div>
        <div class="toolbar-actions">
          <button id="create-folder-btn" class="btn-ghost">
            <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M3 7a1 1 0 0 1 1-1h4l2 2h10a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M12 12v4M10 14h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            New folder
          </button>
          <div class="upload-area" id="upload-area">
            <input type="file" id="file-input" multiple style="display: none;">
            <button id="upload-btn" class="btn-primary">
              <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M12 16V5M8 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
              Upload
            </button>
            <span class="drag-text">or drop files anywhere here</span>
          </div>
        </div>
      </div>
      <div id="file-list" class="file-list">
        <div class="file-list-header">
          <div class="col-name">Name</div>
          <div class="col-size">Size</div>
          <div class="col-actions">Actions</div>
        </div>
        <div id="file-list-items"></div>
      </div>
    </div>
  </div>
  <div id="upload-tray" class="upload-tray hidden" aria-live="polite"></div>
  <footer class="footer">
    <p data-vlt="footer"></p>
  </footer>
  <div id="drop-overlay" class="drop-overlay hidden" aria-hidden="true">
    <div class="drop-overlay-inner">
      <svg viewBox="0 0 24 24" width="34" height="34"><path d="M12 16V5M8 9l4-4 4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <span>Drop to upload</span>
    </div>
  </div>
  <script src="/vui.js"></script>
<script src="/app.js"></script>
</body>
</html>
